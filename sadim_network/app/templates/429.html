{% extends "layouts/public.html" %}
{% block title %}429 — طلبات كثيرة | شبكة سديم{% endblock %}

{% block content %}
<div class="sd-container" style="padding-block: var(--sd-sp-12);">
    <div class="sd-state sd-state-error">
        <div class="sd-state-icon"><i class="fas fa-gauge-high"></i></div>
        <span class="sd-badge sd-badge-danger" style="margin-bottom: var(--sd-sp-2);">
            <span class="sd-badge-dot"></span> طلبات كثيرة
        </span>
        <div class="sd-eyebrow" style="margin-bottom: -0.5rem;">خطأ 429</div>
        <div class="sd-state-title">تجاوزت الحد المسموح به</div>
        <div class="sd-state-desc">لقد أرسلت عدداً كبيراً من الطلبات في وقت قصير جداً. انتظر لحظة ثم حاول مجدداً.</div>
        <div style="display:flex; gap: var(--sd-sp-3); margin-top: var(--sd-sp-4); flex-wrap: wrap; justify-content: center;">
            <button type="button" class="sd-btn sd-btn-primary sd-ripple" onclick="window.location.reload()">
                <i class="fas fa-rotate-right"></i> حاول مجدداً
            </button>
            <a href="{{ url_for('loading_bp.landing_page') }}" class="sd-btn sd-btn-secondary sd-ripple">
                <i class="fas fa-house"></i> العودة للرئيسية
            </a>
        </div>
    </div>
</div>
{% endblock %}
