<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - طلبات كثيرة | شبكة سديم</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* * Sadeem Network - 429 Too Many Requests Page
         * Unified Cyberpunk / Dark Glassmorphism Architecture
         */

        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --color-bg: #09090d;                  /* أسود كوني عميق ومستقبلي */
            --color-primary: rgba(18, 18, 24, 0.75); /* الحاويات الشفافة الزجاجية المعتمدة */
            --color-accent: #7c4dff;              /* الأرجواني النيون الحيوي */
            --color-light: #b388ff;               /* لون النجوم/التوهجات المضيئة */
            --color-deep: #ffffff;                /* أبيض ناصع للنصوص */
            --text-muted: #9c9cab;                /* النص الثانوي الرمادي */
            --border-color: rgba(255, 255, 255, 0.08); /* حدود الحاويات الشفافة */
            --border-light: rgba(124, 77, 255, 0.03); /* شبكة ديجيتال نيون خلفية */
            --blur: blur(18px);                   /* تأثير الضبابية الزجاجي الخلفي */
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 24px;                       /* الانحناء الموحد للحاويات الكبيره */
            --radius-sm: 14px;                    /* انحناء الكروت والحقول والأزرار */
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --error-neon: #ff5252;                /* أحمر سيبراني متوهج لحالات التحذير والمنع */
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 4vw, 2rem);
            position: relative;
            overflow: hidden;
            direction: rtl;
        }

        /* شبكة التحكم الرقمية الخلفية المحسنة */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border-light) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -2;
        }

        /* عمق الإضاءة السديمية المتوهجة خلف بطاقة الخطأ */
        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(124, 77, 255, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* حاوية التصميم الزجاجية الموحدة */
        .container {
            background: var(--color-primary);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            width: 100%;
            max-width: 460px;
            padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 5vw, 2.2rem);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--error-neon); /* شريط حماية تحذيري علوي */
            box-shadow: var(--shadow);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sadim-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .sadim-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-deep);
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        /* وسم الحالة السيبراني */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--error-neon);
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--error-neon);
        }

        /* رمز الخطأ المتوهج */
        .code {
            font-size: 84px;
            font-weight: 300;
            color: var(--color-deep);
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        .code span { 
            color: var(--error-neon); 
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.6);
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-deep);
            margin-bottom: 0.75rem;
        }

        .desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.7;
            max-width: 360px;
            margin-bottom: 2.5rem;
        }

        /* مجموعات أزرار التحكم */
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-direction: column; /* ترتيب عمودي مريح للمس بالهواتف */
        }

        .btn-sadim {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            min-height: 46px;
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-light), var(--color-accent));
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 77, 255, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--color-deep);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-sadim:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 2rem;
            font-size: 11px;
            font-weight: 600;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover { 
            color: var(--color-light); 
            text-shadow: 0 0 8px rgba(179, 136, 255, 0.4);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2.5rem 1.5rem;
                background: rgba(18, 18, 24, 0.6);
            }
            .code { font-size: 72px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="container">
        <a href="/" class="sadim-logo">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
                <circle cx="14" cy="14" r="3" fill="#ffffff" opacity="0.9"/>
                <circle cx="14" cy="5"  r="1.5" fill="var(--color-light)"/>
                <circle cx="14" cy="23" r="1.5" fill="var(--color-light)"/>
                <circle cx="5"  cy="14" r="1.5" fill="var(--color-light)"/>
                <circle cx="23" cy="14" r="1.5" fill="var(--color-light)"/>
            </svg>
            <span class="sadim-name">شبكة سديم</span>
        </a>

        <div class="badge">
            <span class="dot"></span>
            طلبات كثيرة
        </div>

        <div class="code">4<span>2</span>9</div>
        <div class="title">تجاوزت الحد المسموح به</div>
        <p class="desc">لقد أرسلت عدداً كبيراً من الطلبات في وقت قصير جداً.<br>انتظر لحظة ثم حاول مجدداً.</p>

        <div class="actions">
            <button class="btn-sadim btn-primary" onclick="window.location.reload()">حاول مجدداً</button>
            <a href="/" class="btn-sadim btn-secondary">العودة للرئيسية</a>
        </div>

        <div class="footer">
            <a href="https://sadim.cloud" target="_blank">sadim.cloud</a>
        </div>
    </div>
</body>
</html>
