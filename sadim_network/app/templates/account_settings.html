{% extends "layouts/public.html" %}
{% block title %}تعديل الحساب — شبكة سديم{% endblock %}

{% block extra_head %}
<style>
    .sd-avatar-section { text-align:center; margin-bottom: var(--sd-sp-5); }
    .sd-avatar-ring { position:relative; width:110px; height:110px; margin:0 auto; }
    .sd-avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; border:3px solid var(--sd-border); }
    .sd-avatar-edit-badge {
        position:absolute; bottom:0; inset-inline-end:0; width:34px; height:34px; border-radius:50%;
        background: var(--sd-accent); color:#fff; display:flex; align-items:center; justify-content:center;
        cursor:pointer; border:2px solid var(--sd-bg); font-size:.85rem;
    }
    .sd-avatar-hint { display:block; margin-top: var(--sd-sp-2); font-size: var(--sd-fs-xs); color: var(--sd-text-secondary); }
</style>
{% endblock %}

{% block content %}

<div class="sd-container" style="max-width:520px; padding-block: var(--sd-sp-6);">
    <div class="sd-card">
        <h2 style="margin-top:0; font-size: var(--sd-fs-lg); text-align:center;">تعديل الحساب</h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="sd-avatar-section">
                <div class="sd-avatar-ring">
                    {% if user.profile_image %}
                        <img src="{{ url_for('static', filename='uploads/' + user.profile_image) }}?v=1" alt="الصورة الشخصية">
                    {% else %}
                        <img src="{{ url_for('static', filename='uploads/default_user.png') }}" alt="الصورة الافتراضية">
                    {% endif %}
                    <label for="profile_image" class="sd-avatar-edit-badge" title="تغيير الصورة">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>
                <input type="file" id="profile_image" name="profile_image" accept="image/*" style="display:none;">
                <span class="sd-avatar-hint">اضغط على الكاميرا لتغيير صورتك</span>
            </div>

            <div class="sd-form-group">
                <label class="sd-label" for="name">الاسم</label>
                <input type="text" class="sd-input" id="name" name="name" value="{{ user.username }}" required>
            </div>

            <div class="sd-form-group">
                <label class="sd-label" for="email">البريد الإلكتروني</label>
                <input type="email" class="sd-input" id="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="sd-form-group">
                <label class="sd-label" for="bio">نبذة مختصرة</label>
                <textarea class="sd-textarea" id="bio" name="bio" rows="3" maxlength="300" placeholder="اكتب نبذة قصيرة عنك...">{{ user.bio or '' }}</textarea>
            </div>

            <div class="sd-dropdown-divider" style="margin: var(--sd-sp-5) 0;"></div>

            <label style="display:flex; align-items:center; gap: var(--sd-sp-2); color: var(--sd-danger); font-size: var(--sd-fs-sm); cursor:pointer; margin-bottom: var(--sd-sp-4);">
                <input type="checkbox" name="delete_account" id="delete_account" style="width:18px; height:18px;">
                <i class="fas fa-trash-alt"></i> أرغب في حذف الحساب نهائياً
            </label>

            <button type="submit" class="sd-btn sd-btn-primary sd-btn-block sd-ripple">حفظ التغييرات</button>
        </form>

        <a href="{{ url_for('loading_bp.account') }}" class="sd-btn sd-btn-ghost sd-btn-block" style="margin-top: var(--sd-sp-3);">
            <i class="fas fa-undo"></i> العودة إلى مساحتي
        </a>
    </div>
</div>

{% endblock %}
