{% extends "layouts/auth.html" %}
{% block title %}إنشاء حساب — شبكة سديم{% endblock %}

{% block content %}

<div style="text-align:center; margin-bottom: var(--sd-sp-5);">
    <h1 style="font-size: var(--sd-fs-lg); margin: 0 0 var(--sd-sp-2);">إنشاء حساب جديد</h1>
    <p style="color: var(--sd-text-secondary); font-size: var(--sd-fs-sm); margin:0;">انضم لشبكة سديم</p>
    <p id="liveClock" style="color: var(--sd-text-secondary); font-size: var(--sd-fs-xs); margin-top: var(--sd-sp-2);"></p>
</div>

<div class="sd-alert sd-alert-danger" id="errorMessage" style="display:none; margin-bottom: var(--sd-sp-4);">
    <i class="fas fa-triangle-exclamation sd-alert-icon"></i>
    <span id="errorMessageText">الرجاء التأكد من صحة البيانات!</span>
</div>

<form action="/register" method="POST" onsubmit="return validateForm()">
    <div class="sd-form-group">
        <label class="sd-label" for="username">اسم المستخدم</label>
        <input type="text" class="sd-input" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
    </div>

    <div class="sd-form-group">
        <label class="sd-label" for="email">البريد الإلكتروني</label>
        <input type="email" class="sd-input" id="email" name="email" placeholder="example@email.com" required>
    </div>

    <div class="sd-form-group">
        <label class="sd-label" for="name">الاسم الكامل</label>
        <input type="text" class="sd-input" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
    </div>

    <div class="sd-form-group">
        <label class="sd-label" for="password">كلمة المرور</label>
        <input type="password" class="sd-input" id="password" name="password" placeholder="أدخل كلمة المرور" required minlength="6">
    </div>

    <div class="sd-form-group">
        <label class="sd-label" for="confirm">تأكيد كلمة المرور</label>
        <input type="password" class="sd-input" id="confirm" name="confirm" placeholder="أعد إدخال كلمة المرور" required>
    </div>

    <button type="submit" class="sd-btn sd-btn-primary sd-btn-block sd-ripple">سجّل الآن</button>
</form>

<div style="display:flex; align-items:center; gap: var(--sd-sp-3); margin: var(--sd-sp-5) 0; color: var(--sd-text-secondary); font-size: var(--sd-fs-xs);">
    <div style="flex:1; height:1px; background: var(--sd-border);"></div>
    أو
    <div style="flex:1; height:1px; background: var(--sd-border);"></div>
</div>

<a href="/auth/google" class="sd-btn sd-btn-secondary sd-btn-block sd-ripple" style="gap: var(--sd-sp-2);">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" width="18">
    تسجيل الدخول بـ Google
</a>

<div style="text-align:center; margin-top: var(--sd-sp-5); font-size: var(--sd-fs-sm); color: var(--sd-text-secondary);">
    هل لديك حساب؟ <a href="/login" style="color: var(--sd-accent-light);">تسجيل الدخول</a>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
    function validateForm() {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const email = document.getElementById('email').value;
        const errorBox = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorMessageText');

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.style.display = 'flex';
            setTimeout(() => { errorBox.style.display = 'none'; }, 3000);
        }

        if (!email.includes('@') || !email.includes('.')) {
            showError('البريد الإلكتروني غير صحيح!');
            return false;
        }
        if (password !== confirm) {
            showError('كلمة المرور غير متطابقة!');
            return false;
        }
        if (password.length < 6) {
            showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل!');
            return false;
        }
        return true;
    }

    function updateClock() {
        const now = new Date();
        const hour = now.getHours();
        let greeting;
        if (hour < 12) greeting = "صباح الخير 🌞";
        else if (hour < 18) greeting = "مساء الخير 🌞";
        else greeting = "مساء الخير 🌙";
        document.getElementById("liveClock").innerText = greeting + "، الوقت المحلي الآن: " + now.toLocaleTimeString('ar-SA');
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
{% endblock %}
