{% extends "layouts/dashboard.html" %}
{% block title %}إضافة مستخدم جديد — شبكة سديم{% endblock %}
{% block page_title %}إضافة مستخدم جديد{% endblock %}

{% block content %}

<div class="sd-card" style="max-width: 560px; margin-inline: auto;">
    <h2 style="margin-top:0; font-size: var(--sd-fs-lg);"><i class="fas fa-user-plus"></i> إضافة مستخدم جديد</h2>

    <form method="POST">
        <div class="sd-form-group">
            <label class="sd-label" for="name">الاسم الثلاثي</label>
            <input type="text" class="sd-input" id="name" name="name" placeholder="أدخل الاسم الكامل" required>
        </div>

        <div class="sd-form-group">
            <label class="sd-label" for="username">اسم المستخدم (Username)</label>
            <input type="text" class="sd-input" id="username" name="username" placeholder="مثال: ahmad_2024" required>
        </div>

        <div class="sd-form-group">
            <label class="sd-label" for="email">البريد الإلكتروني</label>
            <input type="email" class="sd-input" id="email" name="email" placeholder="email@example.com" required>
        </div>

        <div class="sd-form-group">
            <label class="sd-label" for="password">كلمة المرور</label>
            <input type="password" class="sd-input" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="sd-form-group" style="display:flex; align-items:center; gap: var(--sd-sp-2);">
            <input type="checkbox" id="is_verified" name="is_verified" style="width:18px; height:18px;">
            <label class="sd-label" for="is_verified" style="margin:0;">تم التحقق من البريد الإلكتروني</label>
        </div>

        <div class="sd-form-group">
            <label class="sd-label" for="role">صلاحية الوصول</label>
            <select class="sd-select" id="role" name="role" required>
                <option value="user">👤 مستخدم عادي</option>
                <option value="admin">🔐 مشرف نظام (Admin)</option>
            </select>
        </div>

        <button type="submit" class="sd-btn sd-btn-primary sd-btn-block sd-ripple">
            <i class="fas fa-user-plus"></i> تثبيت العضوية في سديم
        </button>
    </form>

    <a href="{{ url_for('admin.admin_users_list') }}" class="sd-btn sd-btn-ghost sd-btn-block" style="margin-top: var(--sd-sp-3);">
        <i class="fas fa-arrow-right"></i> عودة إلى قائمة المستخدمين
    </a>
</div>

{% endblock %}
