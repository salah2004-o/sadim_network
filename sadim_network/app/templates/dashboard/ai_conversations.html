{% extends 'base.html' %}{% block title %}محادثات Sadeem AI{% endblock %}{% block content %}<h1>محادثات Sadeem AI</h1><form><input name="q" value="{{ query }}" placeholder="بحث باسم المستخدم أو المحادثة"><select name="status"><option value="">كل الحالات</option><option value="success"{% if status == 'success' %} selected{% endif %}>نجح</option><option value="fallback"{% if status == 'fallback' %} selected{% endif %}>Fallback</option></select><button>بحث</button></form><table class="table table-dark"><thead><tr><th>المستخدم</th><th>المحادثة</th><th>الحالة</th><th>الرسائل</th><th>آخر نشاط</th><th></th></tr></thead><tbody>{% for c in conversations %}<tr><td><a href="{{ url_for('admin.ai_user_profile', user_id=c[4]) }}">{{ c[5] or c[6] }}</a></td><td>{{ c[1] }}</td><td>{{ c[7] }}</td><td>{{ c[8] }}</td><td>{{ c[3] }}</td><td><a href="{{ url_for('admin.ai_conversation', conversation_id=c[0]) }}">عرض</a></td></tr>{% else %}<tr><td colspan="6">لا توجد محادثات.</td></tr>{% endfor %}</tbody></table>{% endblock %}
