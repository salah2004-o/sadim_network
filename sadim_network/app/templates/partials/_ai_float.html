<aside class="sd-ai-float" data-sd-ai-float dir="rtl">
    <div class="sd-ai-float__drawer" data-sd-ai-drawer aria-hidden="true" aria-labelledby="sd-ai-float-title">
        <button type="button" class="sd-ai-float__close" data-sd-ai-close aria-label="إغلاق مساعد Sadeem AI"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        <h2 id="sd-ai-float-title">Sadeem AI</h2>
        {% if session.get('user_id') %}
        <p>اسأل عن مكتبة سديم ومقالاتها وخدماتها، وواصل محادثتك من مكانها.</p>
        <a class="sd-btn sd-btn-primary sd-ai-float__action" href="{{ url_for('ai.index') }}"><i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> فتح المساعد</a>
        {% else %}
        <p>اكتشف محتوى وخدمات شبكة سديم. سجّل دخولك لحفظ المحادثات والحصول على تجربة شخصية.</p>
        <a class="sd-btn sd-btn-primary sd-ai-float__action" href="{{ url_for('loading_bp.login') }}"><i class="fas fa-right-to-bracket" aria-hidden="true"></i> تسجيل الدخول</a>
        {% endif %}
    </div>
    <button type="button" class="sd-ai-float__trigger" data-sd-ai-trigger aria-expanded="false" aria-controls="sd-ai-float-title" aria-label="فتح مساعد Sadeem AI"><span class="sd-ai-float__icon"><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i></span><span class="sd-ai-float__label">سديم AI</span></button>
</aside>
