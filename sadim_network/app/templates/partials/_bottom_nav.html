{% set path = request.path %}
<nav class="sd-bottom-nav" aria-label="التنقل السريع">
    <a href="{{ url_for('main.index') }}" class="sd-bottom-nav__item {% if path == '/' %}is-active{% endif %}">
        <i class="fas fa-house" aria-hidden="true"></i>
        <span>الرئيسية</span>
    </a>
    <a href="{{ url_for('main.discover') }}" class="sd-bottom-nav__item {% if path.startswith('/discover') %}is-active{% endif %}">
        <i class="fas fa-compass" aria-hidden="true"></i>
        <span>اكتشف</span>
    </a>
    <a href="{{ url_for('articles.list_articles') }}" class="sd-bottom-nav__item {% if path.startswith('/articles') %}is-active{% endif %}">
        <i class="fas fa-newspaper" aria-hidden="true"></i>
        <span>المنشورات</span>
    </a>
    <a href="{{ url_for('library.library') }}" class="sd-bottom-nav__item {% if path.startswith('/library') %}is-active{% endif %}">
        <i class="fas fa-book-open" aria-hidden="true"></i>
        <span>المكتبة</span>
    </a>
    {% if session.get('user_id') %}
    <a href="{{ url_for('loading_bp.account') }}" class="sd-bottom-nav__item {% if path.startswith('/account') %}is-active{% endif %}">
        <i class="fas fa-user" aria-hidden="true"></i>
        <span>حسابي</span>
    </a>
    {% endif %}
</nav>
