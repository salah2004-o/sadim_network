{# canonical + hreflang. المتغير canonical اختياري — الافتراضي رابط الصفحة نفسها بدون query #}
{% set _canonical = canonical or canonical_url() %}
<link rel="canonical" href="{{ _canonical }}">
<link rel="alternate" hreflang="ar" href="{{ _canonical }}">
<link rel="alternate" hreflang="x-default" href="{{ _canonical }}">
